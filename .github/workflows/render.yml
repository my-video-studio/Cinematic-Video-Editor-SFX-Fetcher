name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Remotion Composition ID to render'
        required: true
        type: string
        default: 'HistoricalDocumentary'
      output_filename:
        description: 'Output MP4 filename inside out/'
        required: true
        type: string
        default: 'video.mp4'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render "${{ github.event.inputs.composition_id }}" "out/${{ github.event.inputs.output_filename }}"

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/${{ github.event.inputs.output_filename }}
          if-no-files-found: error
